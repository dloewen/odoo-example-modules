repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pylint-odoo
        name: pylint-odoo
        entry: pylint
        language: python
        types: [python]
        args: [--rcfile=.pylintrc-mandatory, --load-plugins=pylint_odoo]
        additional_dependencies:
          - pylint-odoo>=9.0.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: "^.*\\.min\\.(js|css)$"

exclude: |
  (?x)^(
    .*\.pot?|
    setup/.*|
    .*/migrations/.*|
    .*/static/lib/.*|
    .*/static/src/lib/.*
  )$
